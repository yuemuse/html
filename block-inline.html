<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BlockとInline</title>
</head>
<body>
    <h1>Block</h1>
    <p>こんにちは、世界！</p>
    <div>こんにちは、世界！</div>
    <h1>Inline</h1>
    <span>こんにちは、世界！</span>
    <span>こんにちは、世界！</span>
</body>
</html>
